[project]
name = "banclaser"
version = "0.1.0"
description = "Banc de test de diode laser piloté par Raspberry Pi — kit de démarrage du carnet photonique"
authors = [{ name = "Kouthieye Thiaw" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
# sur la Raspberry Pi uniquement (picamera2 s'installe avec apt : sudo apt install python3-picamera2)
pi = ["smbus2>=0.5", "gpiozero>=2.0", "lgpio>=0.2", "rpi-hardware-pwm>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
banclaser = "banclaser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

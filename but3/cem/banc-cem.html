.iso{

.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso-page{width:min(880px,100% - 32px);margin:64px auto 96px}

n : courants, champs E et H, ondes</span></span><span class="iso-caption">Un banc CEM sur plan de masse en cuivre. La source découpe, les câbles couplent, la victime reçoit ; son aiguille (en dBµV) suit les formules du cours pour le temps de montée choisi.</span></figcaption></figure><nav class="cem-nav" aria-label="Étapes"><button class="cem-prev" aria-label="Étape précédente">←</button><button class="cem-tab" title="La CEM : source → couplage → victime">01</button><button class="cem-tab" title="Un front raide, ce sont des hautes fréquences">02</button><button class="cem-tab" title="Mode différentiel et mode commun">03</button><button class="cem-tab" title="Les sources de perturbation">04</button><button class="cem-tab" title="Couplage par impédance commune">05</button><button class="cem-tab" title="Couplage capacitif (câble à câble)">06</button><button class="cem-tab" title="Couplage inductif (câble à câble, champ à boucle)">07</button><button class="cem-tab" title="Couplage par rayonnement">08</button><button class="cem-tab" title="Protéger la carte">09</button><button class="cem-tab" title="Protéger l'installation">10</button><button class="cem-tab" title="Mesurer et respecter la norme">11</button><button class="cem-next">Étape suivante →</button></nav><section aria-live="polite"><h2 class="cem-title"></h2><p class="cem-ref"></p><div class="cem-body"></div><p class="cem-mach"></p></section></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

eurs et <b>revient par la masse</b>. La tension se mesure entre les conducteurs et la masse.","Ce sont les <b>capacités parasites</b> entre les appareils et la masse qui ferment cette boucle en haute fréquence. C'est le cas le plus courant en CEM."],"m":"Le courant rouge file sur le câble et revient en sens inverse dans le plan de cuivre : la boucle câble-plan est la boucle de mode commun."},{"t":"Les sources de perturbation","ref":"diapos 74-81","on":["pcb","ant"],"fx":["flow","waves"],"p":["<b>Alimentations à découpage</b> : raie typique à 470 kHz, bruit continu de 1 kHz à 100 MHz, en conduit et en rayonné.","<b>Contacts secs</b> (relais) : rafales d'étincelles de quelques kV, fronts de 5 à 10 ns. <b>Décharges électrostatiques</b> : 1 à 10 ns. <b>Foudre</b>, <b>émetteurs radio</b> : E = √(30·P·G) / D.","<b>Circuits logiques</b> : les pics de courant grandissent avec l'intégration (100 mA à 16 MHz, 3 A en 2 ns à 500 MHz). Point commun de toutes ces sources : de forts dU/dt et di/dt."],"m":"Sur la carte : le transistor sur son radiateur découpe, le transformateur stocke l'énergie. Au fond, l'antenne joue l'émetteur radio."},{"t":"Couplage par impédance commune","ref":"diapos 83-92, 111","on":["strap"],"fx":["z0","flow"],"p":["Deux circuits partagent un même conducteur de masse. Son impédance <b>Z0 n'est jamais nulle</b> : résistance en basse fréquence (R = ρ·L/S), inductance en haute fréquence (<b>L ≈ 1 µH/m</b>, soit 10 nH/cm).","Le courant du circuit perturbateur y crée <b>U = Z0·I</b>, qui s'ajoute directement au signal de la victime.","Exemple du cours : 5 cm de piste commune (50 nH), 50 mA en 5 ns : U = L·ΔI/Δt = <b>500 mV</b>. La résistance seule (81 mΩ) ne donnerait que 4 mV."],"m":"La barrette allumée relie la masse du capteur au châssis de la source : tout le courant de retour y passe et décale le zéro du capteur."},{"t":"Couplage capacitif (câble à câble)","ref":"diapos 93, 118-125, 135","on":["culprit","vcable"],"fx":["e","flow"],"p":["Une tension crée un "plane"],"fx":[],"p":["<b>Plan de masse</b> : son impédance par carré ne dépend pas de sa taille (0,37·√F mΩ). Jamais de fente : 10 cm de fente valent 6,28 Ω à 100 MHz. Un plan unique analogique/numérique.","<b>Découplage</b> : un condensateur au plus près de chaque circuit, pattes courtes. Un 12 nF avec 2 × 2 cm de pattes (40 nH) ne découple plus au-dessus de 7,26 MHz.","<b>Routage</b> : fil aller proche du fil retour, horloges routées en premier et encadrées de pistes de masse, pistes sensibles au centre, 0 V boulonné au châssis côté numérique."],"m":"Sur la carte : le petit condensateur collé au circuit intégré, la piste d'horloge (claire) entre ses deux pistes de masse. Dessous, le plan de cuivre remplace la piste commune."},{"t":"Protéger l'installation","ref":"diapos 138-160","on":["vic","vcable"],"fx":["waves"],"p":["<b>Blindage</b> : une enceinte conductrice réfléchit puis absorbe l'onde (A = R + A + B, épaisseur de peau δ). En pratique son efficacité HF ne dépend que des <b>ouvertures</b>, et le traitement des câbles reste prioritaire.","<b>Câbles blindés</b> : faible impédance de transfert, raccordés <b>aux deux extrémités sur 360°</b> (jamais en « queue de cochon ») : 60 à 80 dB. Chemin de câble métallique continu : 30 dB.","<b>Filtres</b> : boîtier métal, masse au plus court, entrée loin de la sortie. <b>Ferrites</b> : elles n'agissent que sur le mode commun (gain d'un facteur 2 environ)."],"m":"Le coffret de la victime sert de cage de Faraday (aluminium 1 mm, exemple du cours) ; son câble y entre par un presse-étoupe qui reprend le blindage sur 360°."},{"t":"Mesurer et respecter la norme","ref":"diapos 161-165","on":["ant","vic"],"fx":["waves","flow"],"p":["Directive <b>2014/30/UE</b> : un appareil qui perturbe ou qui peut être perturbé ne peut être vendu (marquage CE) que s'il est conforme en CEM.","<b>Émission conduite</b> : mesurée avec un RSIL de 0,15 à 30 MHz. <b>Émission rayonnée</b> : mesurée à l'antenne de 30 MHz à 1 GHz, limite 30 dBµV/m jusqu'     case 9:return[Math.max(0,Ed-AR),"δ = "+fr(delta*1e6,1)+" µm · réflexion "+fr(AR,0)+" dB à "+fs];
    case 10:return[Ed,fr(Ed,0)+" dBµV/m · limite "+lim+(FM<30?" · sous 30 MHz : mesure au RSIL":Ed>lim?" · non conforme":" · conforme")];
    default:return[dbu(Uz),"source → couplage → victime · "+ts];
  }
}
let step=0,tm=3.5e-9,target=tm,lvl={at:60,rate:0},clock=0,frame=0,last=0,visible=false,touring=!still.matches,idle=0,said="";
const tabs=[...document.querySelectorAll(".cem-tab")],title=$(".cem-title"),ref=$(".cem-ref"),text=$(".cem-body"),mach=$(".cem-mach");
function setStep(n){
  step=(n+STEPS.length)%STEPS.length;const s=STEPS[step];
  svg.querySelectorAll("[data-sys]").forEach((g)=>g.classList.toggle("on",s.on.includes(g.dataset.sys)));
  svg.querySelectorAll("[data-fx]").forEach((g)=>g.classList.toggle("on",s.fx.includes(g.dataset.fx)));
  tabs.forEach((b,i)=>{b.setAttribute("aria-current",i===step?"step":"false");});
  title.textContent=(step+1)+". "+s.t;ref.textContent="Ton cours : "+s.ref;text.innerHTML=s.p.map((p)=>"<p>"+p+"</p>").join("");mach.textContent=s.m;
  stage.setAttribute("aria-valuetext","Étape "+(step+1)+" sur "+STEPS.length+" : "+s.t);stage.setAttribute("aria-valuenow",String(step+1));
  run();
}
function draw(){
  const [level,say]=model(step,tm);
  const want=Math.min(140,Math.max(0,level));
  const a=FROM+SPAN*lvl.at/140,[x,y]=DIAL;
  needle.setAttribute("d",lineOnTop([x-Math.sin(a)*3,y+Math.cos(a)*3],[x+Math.sin(a)*(DR-4),y-Math.cos(a)*(DR-4)],DT+0.2,P));
  const u=1-Math.log10(tm/1e-9)/2,ka=FROM+SPAN*u;
  pointer.setAttribute("d",lineOnTop([KNOB[0],KNOB[1]],[KNOB[0]+Math.sin(ka)*4.6,KNOB[1]-Math.cos(ka)*4.6],12,P));
  const half=tm/250e-9*WW/2;
  w0.setAttribute("d","M-2 16H"+(WW/2-half).toFixed(2)+"L"+(WW/2+half).toFixed(2)+" 4H"+(WW+2));
  const fx=(f)=>Math.log10(f/0.3e6)/4*WW,F=0.35/tm,env=(f)=>{const d=f<=0.3e6?0:f<=F?20*Math.log10(f/0.3e6):20*Math.log10(F/0.3e6)+40*Math.log10(f/F);return Math.min(WH-1,2+d/120*17);};
  let d="M-2 "+env(0.3e6).toFixed(2);for(let i=0;i<=41;i++){const f=0.3e6*10**(i/10);d+="L"+fx(f).toFixed(2)+" "+env(f).toFixed(2);}
  for(let i=1;i<20;i++){const f=0.3e6*10**(i/5);d+="M"+fx(f).toFixed(2)+" "+(WH+1)+"V"+env(f).toFixed(2);}
  w1.setAttribute("d",d);fcEl.setAttribute("d","M"+fx(F).toFixed(2)+" -1V"+(WH+1));
  let w="";for(let i=0;i<4;i++){const r=((clock*26+i*42)%168)+2,o=Math.sin(Math.PI*r/170)**1.5;w+='<path class="iso-line" data-tone="red" opacity="'+o.toFixed(2)+'" d="'+ring(ANT[0],ANT[1],r,0.05,P,48)+'"/>';}
  waves.innerHTML=w;
  if(say!==said){said=say;readout.textContent=say;}
  return want;
}
function tick(now){
  const dt=last?Math.min((now-last)/1000,1/30):1/60;last=now;const calm=still.matches;clock+=dt;
  if(touring)target=1e-9*10**(1+0.75*Math.sin(clock*0.55));
  const lt=Math.log(target),l=Math.log(tm);tm=calm?target:Math.exp(l+(lt-l)*(1-Math.exp(-dt/0.25)));
  const want=draw();
  if(calm){lvl.at=want;lvl.rate=0;draw();}else for(let i=0;i<4;i++){lvl.rate+=((want-lvl.at)*120-lvl.rate*16)*dt/4;lvl.at+=lvl.rate*dt/4;}
  frame=visible&&!calm?requestAnimationFrame(tick):0;
}
const run=()=>{if(still.matches){const w=draw();lvl.at=w;draw();return;}if(!frame&&visible){last=0;frame=requestAnimationFrame(tick);}};
const hold=()=>{touring=false;clearTimeout(idle);idle=setTimeout(()=>{touring=!still.matches;},6000);run();};
new IntersectionObserver((e)=>{visible=e[e.length-1].isIntersecting;if(visible)run();},{rootMargin:"120px 0px"}).observe(stage);
stage.addEventListener("pointermove",(e)=>{const b=svg.getBoundingClientRect(),s=Math.min(1,Math.max(0,((e.clientX-b.left)/b.width-0.15)/0.7));target=1e-9*10**(2-2*s);hold();});
stage.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight")setStep(step+1);else if(e.key==="ArrowLeft")setStep(step-1);
  else if(e.key==="ArrowUp"){target=Math.max(1e-9,target/1.5);hold();}else if(e.key==="ArrowDown"){target=Math.min(1e-7,target*1.5);hold();}
  else if(e.key==="Home")setStep(0);else if(e.key==="End")setStep(STEPS.length-1);else return;e.preventDefault();});
tabs.forEach((b,i)=>b.addEventListener("click",()=>setStep(i)));
$(".cem-prev").addEventListener("click",()=>setStep(step-1));$(".cem-next").addEventListener("click",()=>setStep(step+1));
setStep(0);
</script></body></html>
